<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PowerTerminal — Book</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
  /* 📖 Book mode — a session read as a book: one page = request → answer → work window.
     A separate page on purpose: the main screen is one big inline script and must not grow. */
  :root { --desk:#2b2d33; --bar:#1f2126; --bar-text:#e8e9ee; --paper:#fdfcf8; --ink:#1f2330; --muted:#8a8f9c; --accent:#4f7cff; --line:#3a3d46;
          --body:"Noto Serif KR","Nanum Myeongjo","Batang",Georgia,serif; --ui:-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
          --padx:32px; --pady:28px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { display:flex; flex-direction:column; background:var(--desk); color:var(--bar-text); font:14px/1.5 var(--ui); overflow:hidden; }
  button { font: inherit; cursor: pointer; }
  .bar { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:8px 14px; padding-top:calc(8px + env(safe-area-inset-top)); background:var(--bar); }
  .bar .ttl { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .bar .sp { flex:1; }
  .btn { font-size:13px; padding:6px 11px; border-radius:6px; border:1px solid var(--line); background:#2a2d34; color:var(--bar-text); white-space:nowrap; text-decoration:none; }
  .btn:hover { border-color:var(--accent); }
  .stage { flex:1 1 auto; min-height:0; display:flex; }
  /* shelf = session list */
  .shelf { flex:0 0 140px; background:#24262c; border-right:1px solid #33363e; padding:10px 8px; overflow-y:auto; }
  .shelf h3 { font-size:11px; color:var(--muted); font-weight:600; margin:10px 4px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shelf h3:first-child { margin-top:0; }
  .spine { all:unset; display:flex; align-items:center; gap:7px; width:100%; box-sizing:border-box; padding:8px; margin-bottom:5px; border-radius:4px 7px 7px 4px; cursor:pointer;
           font-size:12.5px; color:#fff; border-left:5px solid rgba(0,0,0,.28); box-shadow:0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .spine:hover { transform: translateX(3px); }
  .spine:focus-visible { outline:2px solid #fff; }
  .spine.cur { transform: translateX(8px); box-shadow:0 3px 10px rgba(0,0,0,.45); }
  .spine i { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); flex:0 0 auto; }
  .spine.busy i { background:#34d399; animation: pulse 1.2s infinite; }
  .spine span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @keyframes pulse { 50% { opacity:.3; } }
  .center { flex:1 1 auto; min-width:0; max-width:100%; display:flex; flex-direction:column; }
  .bookwrap { flex:1 1 auto; min-height:0; display:flex; align-items:stretch; justify-content:center; padding:34px 20px 8px; }
  .book { position:relative; width:min(100%, 1160px); filter: drop-shadow(0 10px 24px rgba(0,0,0,.45)); }
  .marks { position:absolute; left:26px; right:26px; bottom:100%; display:flex; gap:4px; align-items:flex-end; overflow:hidden; }
  .mark { all:unset; cursor:pointer; font-size:11px; padding:4px 8px; border-radius:5px 5px 0 0; background:#c9b78a; color:#3a2f12; white-space:nowrap; }
  .mark.cur { background:#f0d98c; font-weight:700; padding-top:8px; }
  /* pages: the text flows through CSS columns; turning a page slides the flow sideways */
  .vp { position:absolute; inset:0; background:var(--paper); border-radius:6px; overflow:hidden; padding:var(--pady) var(--padx) calc(var(--pady) + 12px); }
  .clip { width:100%; height:100%; overflow:hidden; }
  .flow { height:100%; columns:2; column-gap:calc(var(--padx) * 2); column-fill:auto; color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.75;
          transition: transform .38s cubic-bezier(.3,.7,.2,1); will-change: transform; }
  .gutter { position:absolute; top:0; bottom:0; left:50%; width:60px; margin-left:-30px; pointer-events:none;
            background:linear-gradient(90deg, transparent, rgba(0,0,0,.10) 46%, rgba(0,0,0,.16) 50%, rgba(0,0,0,.10) 54%, transparent); }
  .pno { position:absolute; bottom:9px; font:11px var(--ui); color:var(--muted); pointer-events:none; }
  .pno.l { left:var(--padx); } .pno.r { right:var(--padx); }
  .turnbtn { all:unset; cursor:pointer; position:absolute; top:0; bottom:0; width:30px; display:flex; align-items:center; justify-content:center; color:transparent; font-size:22px; z-index:2; }
  .turnbtn:hover, .turnbtn:focus-visible { color:var(--muted); background:rgba(0,0,0,.04); }
  .turnbtn.prev { left:0; border-radius:6px 0 0 6px; } .turnbtn.next { right:0; border-radius:0 6px 6px 0; }
  .turnbtn[disabled] { display:none; }
  .turn { break-before: column; }
  .turn:first-child { break-before: auto; }
  .cover { text-align:center; padding-top:18%; font-family:var(--ui); }
  .cover h1 { font:700 24px var(--body); margin:0 0 8px; }
  .cover p { color:var(--muted); font-size:12.5px; margin:4px 0; word-break:break-all; }
  .cover button { margin-top:18px; padding:8px 14px; border-radius:8px; border:1px solid #cfc9b8; background:#f3f0e7; color:var(--ink); font-size:13px; }
  .q { font:13px/1.55 var(--ui); background:#eef3ff; border-left:4px solid var(--accent); border-radius:0 6px 6px 0; padding:9px 12px; margin:0 0 12px; break-inside:avoid; white-space:pre-wrap; word-break:break-word; max-height:60%; overflow:auto; }
  .q small { display:block; color:#5d6b8a; font-size:11px; margin-bottom:2px; white-space:normal; }
  .q .att { display:inline-block; font-size:11.5px; background:#dfe7fb; border-radius:4px; padding:0 6px; margin:0 2px; }
  .a h4 { font:700 14px var(--ui); margin:14px 0 4px; break-after:avoid; }
  .a h5 { font:700 13px var(--ui); margin:10px 0 3px; break-after:avoid; }
  .a p { margin:0 0 9px; } .a ul, .a ol { margin:0 0 9px; padding-left:20px; } .a li { margin:2px 0; }
  .a li.in1 { margin-left:18px; } .a li.in2 { margin-left:36px; }
  .a code { font:12.5px Consolas, "D2Coding", monospace; background:#f0ede4; padding:1px 4px; border-radius:3px; word-break:break-all; }
  .a pre { font:12px/1.5 Consolas, "D2Coding", monospace; background:#f3f0e7; border-radius:6px; padding:9px 11px; margin:0 0 10px; overflow:auto; max-height:55vh; white-space:pre; break-inside:avoid; }
  .a pre code { background:none; padding:0; word-break:normal; }
  .a blockquote { margin:0 0 9px; padding:6px 12px; border-left:3px solid #cfc9b8; color:#4b5063; background:#f8f6ef; }
  .a hr { border:none; border-top:1px solid #e3dfd2; margin:12px 0; }
  .a a { color:#2f5be0; word-break:break-all; } .q a { color: var(--link, #2f5be0); word-break: break-all; } .a a, .q a { overflow-wrap: anywhere; text-decoration: underline; }
  .a .tw { overflow-x:auto; margin:0 0 10px; }
  .a table { border-collapse:collapse; font:12.5px/1.5 var(--ui); min-width:60%; }
  .a th, .a td { border:1px solid #ddd8c9; padding:4px 8px; text-align:left; vertical-align:top; }
  .a th { background:#f3f0e7; } .a tr { break-inside:avoid; }
  .work { margin:12px 0 4px; border:1px solid #d9d4c6; border-radius:8px; overflow:hidden; font-family:var(--ui); break-inside:avoid; }
  .wh { display:flex; align-items:center; gap:8px; padding:6px 10px; background:#f3f0e7; font-size:12px; color:#5c5648; }
  .wh b { color:var(--ink); }
  .wh button { all:unset; cursor:pointer; margin-left:auto; color:#2f5be0; font-size:12px; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:#9ca3af; flex:0 0 auto; }
  .work.live .dot { background:#34d399; animation:pulse 1.2s infinite; }
  .steps { display:none; padding:8px 12px; font-size:12px; line-height:1.6; color:#4b4638; background:#faf8f1; border-top:1px solid #e9e5da; max-height:40vh; overflow:auto; }
  .work.open .steps { display:block; }
  .steps div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .steps .f { color:#2f5be0; } .steps .n { color:#6b6657; white-space:normal; margin:3px 0; }
  .termbox { position:relative; height:210px; background:#16181d; overflow:hidden; }
  .work.big .termbox { height:440px; }
  .termbox .tin { position:absolute; left:0; bottom:0; transform-origin:left bottom; }
  .termbox .xterm-viewport { overflow:hidden !important; }
  .pending { color:var(--muted); font:13px var(--ui); margin-top:8px; }
  /* 📖 thick-paper flip (StPageFlip, wide screens). The column flow above stays as the source; its blocks are
     copied into fixed pages here. Phones keep the simple slide. */
  .flipwrap { position:absolute; inset:0; display:none; }
  .book.flip .flipwrap { display:block; }
  .book.flip .vp, .book.flip .gutter { visibility:hidden; pointer-events:none; }
  .meas { position:absolute; left:0; top:0; width:0; height:0; overflow:hidden; visibility:hidden; pointer-events:none; }   /* zero box: measuring pages must not widen the document */
  .pg { background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.75; padding:var(--pady) var(--padx) calc(var(--pady) + 12px); overflow:hidden; box-sizing:border-box; }
  .pg .pgin { height:100%; overflow:hidden; }
  .pg .pgin > .tall { overflow:auto; }
  .pg.--left { border-radius:6px 0 0 6px; box-shadow: inset -22px 0 26px -20px rgba(0,0,0,.30), inset 0 0 0 1px rgba(0,0,0,.05); }
  .pg.--right { border-radius:0 6px 6px 0; box-shadow: inset 22px 0 26px -20px rgba(0,0,0,.30), inset 0 0 0 1px rgba(0,0,0,.05); }
  .pg .pgno { position:absolute; bottom:9px; font:11px var(--ui); color:var(--muted); }
  .pg.--left .pgno { left:var(--padx); } .pg.--right .pgno { right:var(--padx); }
  .book.flip .pno { display:none; }
  .empty { color:var(--muted); font:14px var(--ui); text-align:center; padding-top:30%; }
  /* request box */
  .ask { flex:0 0 auto; display:flex; gap:8px; align-items:flex-end; padding:8px 20px calc(14px + env(safe-area-inset-bottom)); width:min(100%, 1200px); margin:0 auto; }
  .ask textarea { flex:1; resize:none; height:44px; max-height:160px; font:14px/1.5 var(--ui); padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#1f2126; color:var(--bar-text); outline:none; }
  .ask textarea:focus { border-color:var(--accent); }
  .ask .send { padding:11px 16px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-weight:700; }
  .ask .send:disabled { opacity:.5; cursor:default; }
  /* 📎 지난 쪽을 보며 보낼 때 붙는 것 — 요청칸 위 한 줄 (요청칸과 같이 움직이고, 쪽 글을 덮지 않게 요청칸 영역 안에 둔다) */
  .ask { flex-wrap: wrap; }
  .askctx { order: -1; flex: 1 0 100%; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 4px 6px 4px 10px; border-radius: 8px;
            background: color-mix(in srgb, #f59e0b 16%, var(--paper, #fff)); border: 1px solid color-mix(in srgb, #f59e0b 55%, transparent); color: var(--ink, #222); font: 12.5px/1.4 var(--ui); }
  .askctx[hidden] { display: none; }
  .askctx span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .askctx button { flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: inherit; font-size: 13px; }
  .askctx button:hover { background: color-mix(in srgb, #f59e0b 30%, transparent); }
  @media (max-width: 820px) {
    :root { --padx:18px; --pady:18px; }
    .stage { flex-direction:column; }
    .shelf { flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; border-right:none; border-bottom:1px solid #33363e; padding:8px; }
    .shelf h3 { display:none; } .spine { width:auto; max-width:170px; flex:0 0 auto; margin:0; } .spine.cur, .spine:hover { transform:none; } .spine.cur { outline:2px solid #fff; }
    .bookwrap { padding:28px 8px 4px; } .ask { padding-left:8px; padding-right:8px; }
    .flow { columns:1; font-size:15px; } .gutter, .pno.l { display:none; }
    .bar .hideS { display:none; }
  }

  /* ── 크라모북 화면 구성 (book.css 의 책장·넘김 단추·진행 막대·오른쪽 도구 줄을 본떴다) ── */
  :root { --fs: 15px; --side: 208px; }
  .flow, .pg { font-size: var(--fs); }
  .stage { position: relative; }
  .desk { flex:1 1 auto; min-height:0; display:flex; align-items:stretch; justify-content:center; gap:22px; padding:52px 14px 34px; position:relative; }
  .desk .book { flex:1 1 auto; max-width:1160px; width:auto; }
  .topmid { position:absolute; left:50%; top:8px; transform:translateX(-50%); display:flex; gap:10px; align-items:baseline; max-width:70%;
            padding:5px 16px; border-radius:16px; background:rgba(255,255,255,.07); white-space:nowrap; overflow:hidden; }
  .topmid .ttl { font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; }
  .topmid .sub { color:var(--muted); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; }
  .navcol { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .nav { width:44px; height:64px; border-radius:10px; border:none; background:rgba(255,255,255,.06); color:#cfd2db; font-size:34px; line-height:1; }
  .nav:hover { background:rgba(255,255,255,.14); } .nav:disabled { opacity:.25; cursor:default; }
  .nav.end { height:36px; font-size:15px; }
  .pager { position:absolute; right:8px; bottom:100%; margin-bottom:6px; display:flex; align-items:center; gap:4px; font:12px var(--ui); color:var(--muted); z-index:3; }
  .pager input { width:46px; text-align:center; font:700 12px var(--ui); padding:3px 4px; border-radius:6px; border:1px solid transparent; background:rgba(255,255,255,.08); color:var(--bar-text); outline:none; }
  .pager input:focus { border-color:var(--accent); }
  .prog { position:absolute; left:0; right:0; bottom:-20px; height:6px; border-radius:3px; background:rgba(255,255,255,.09); cursor:pointer; touch-action:none; z-index:3; }
  .prog::after { content:''; position:absolute; left:0; right:0; top:-9px; height:24px; }
  .progbar { position:relative; height:100%; width:0; border-radius:3px; background:var(--accent); transition:width .3s ease; }
  .progbar::after { content:''; position:absolute; right:-6px; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .prog.scrub .progbar { transition:none; }
  .marks { left:8px; right:120px; }
  .ask { padding-top:14px; }
  .side { flex:0 0 var(--side); display:flex; flex-direction:column; gap:7px; padding:12px 10px; background:#1f2126; border-left:1px solid #33363e; overflow-y:auto; }
  .side-h { display:flex; align-items:center; gap:8px; margin:2px 2px 6px; } .side-h b { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sbtn { display:block; width:100%; text-align:left; font:13px var(--ui); padding:9px 12px; border-radius:7px; border:1px solid #3a3d46; background:#2a2d34; color:var(--bar-text); text-decoration:none; }
  .sbtn:hover { border-color:var(--accent); } .sbtn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; text-align:center; }
  .side-note { margin-top:auto; font-size:11.5px; line-height:1.5; color:var(--muted); }
  @media (min-width: 821px) {
    /* 책장 — 세션 하나 = 표지가 보이게 놓은 책 한 권, 세 권씩 한 줄 (크라모북 책장과 같은 모양) */
    .shelf { flex:0 0 212px; display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; align-content:start; padding:16px 10px; overflow-y:auto; overflow-x:hidden;
             background:#24262c; border-right:1px solid #33363e; }
    .shelf h3 { display:none; }
    .shelf .spine { all:unset; box-sizing:border-box; position:relative; aspect-ratio:3 / 4; display:flex; align-items:center; justify-content:center; padding:7px 5px 7px 9px; cursor:pointer;
             color:#fff; font:700 11.5px/1.3 var(--ui); text-align:center; border-radius:3px 6px 6px 3px; overflow:hidden; margin:0;
             box-shadow: inset 5px 0 0 rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.16), 0 2px 5px rgba(0,0,0,.45); transition: transform .15s; }
    .shelf .spine:hover { transform:translateY(-3px); }
    .shelf .spine.cur { outline:2px solid #fff; outline-offset:2px; transform:none; }
    .shelf .spine i { position:absolute; right:5px; top:5px; width:7px; height:7px; }
    .shelf .spine span { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden; white-space:normal; overflow-wrap:anywhere; text-overflow:clip; }
    .desk { align-items:center; }
  }
  /* 펼친 한 장 = 요청 하나. 왼쪽 = 작업 과정(스크롤), 오른쪽 = 요청과 답변 */
  .pg .pgin { overflow-y:auto; scrollbar-width:thin; scrollbar-color:#d6d0bf transparent; }
  .pg.wk { background:#f7f4ea; }
  .pg.wk .pgin { display:flex; flex-direction:column; overflow:hidden; font-family:var(--ui); }
  .pg.wk .work { flex:0 0 auto; margin:0 0 10px; }
  .whd { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:0 2px 8px; margin-bottom:8px; border-bottom:1px solid #e3dfd2; font-size:12.5px; color:#5c5648; }
  .whd b { color:var(--ink); font-size:13.5px; }
  .wlog { flex:1 1 auto; min-height:0; overflow-y:auto; font-size:12.5px; line-height:1.65; color:#4b4638; scrollbar-width:thin; scrollbar-color:#d6d0bf transparent; }
  .wlog div { padding:1px 2px; overflow-wrap:anywhere; }
  .wlog .f { color:#2f5be0; } .wlog .n { color:#2b2f3a; background:#efebdf; border-radius:6px; padding:6px 9px; margin:6px 0; white-space:pre-wrap; }
  .wlog .s { color:#6b6657; } .wlog .none { color:var(--muted); padding-top:20%; text-align:center; }
  .toc { font-family:var(--ui); } .toc h4 { font:700 14px var(--ui); margin:0 0 10px; color:var(--ink); }
  .tocit { all:unset; box-sizing:border-box; display:flex; gap:10px; width:100%; padding:6px 4px; border-bottom:1px dotted #d9d4c6; cursor:pointer; font-size:12.5px; color:var(--ink); }
  .tocit:hover { background:#f3f0e7; } .tocit small { flex:0 0 auto; color:var(--muted); font-size:11.5px; } .tocit span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 날짜마다 첫 장 = 그날 요청 차례 (2026-10-29 CEO) */
  .dayhd { text-align:center; padding-top:30%; font-family:var(--ui); } .dayhd h2 { font:700 26px var(--body); margin:0 0 8px; color:var(--ink); } .dayhd p { color:var(--muted); font-size:13px; margin:0; }
  .daytoc .dayhd { padding-top:4px; text-align:left; margin-bottom:12px; } .daytoc .dayhd h2 { font-size:20px; }
  .tocit b { flex:0 0 auto; font-weight:700; color:var(--ink); }
  .tocit.full { align-items:flex-start; padding:8px 4px; } .tocit.full small { padding-top:2px; } .tocit.full span { white-space:pre-wrap; overflow:visible; text-overflow:clip; overflow-wrap:anywhere; line-height:1.55; }
  @media (max-width: 820px) {
    .desk { padding:30px 6px 26px; gap:0; } .navcol, .topmid { display:none; }
    .side { flex:0 0 auto; flex-direction:row; order:-1; overflow-x:auto; padding:6px 8px; gap:6px; border-left:none; border-bottom:1px solid #33363e; }
    .side-h, .side-note { display:none; } .sbtn { width:auto; flex:0 0 auto; white-space:nowrap; padding:6px 10px; font-size:12px; }
    .stage > .center { order:1; } .stage > .shelf { order:-2; }
  }

  /* ── 글자 크기: 쪽 안의 모든 글(제목·표·코드·요청·작업 과정)이 본문 크기를 따라 같이 커지고 작아진다 ── */
  .flow, .pg { font-size: calc(var(--fs) * var(--fsk, 1)); line-height: var(--lh, 1.75); font-family: var(--body); color: var(--ink); }
  .a h4 { font: 700 1.14em/1.4 var(--headf, var(--ui)); color: var(--head, var(--ink)); margin: 1em 0 .35em; }
  .a h5 { font: 700 1em/1.4 var(--headf, var(--ui)); color: var(--head, var(--ink)); margin: .8em 0 .25em; }
  .a table { font: .9em/1.5 var(--ui); } .a code { font-size: .86em; } .a pre { font-size: .84em; }
  .q { font-size: .92em; } .q small { font-size: .82em; } .q .att { font-size: .88em; }
  .whd { font-size: .88em; } .whd b { font-size: 1.08em; } .wlog { font-size: .88em; }
  .toc h4 { font-size: 1.05em; } .tocit { font-size: .9em; } .tocit small { font-size: .92em; }
  .cover h1 { font-size: 1.7em; font-family: var(--headf, var(--body)); color: var(--head, var(--ink)); } .cover p { font-size: .88em; }
  .pending, .wlog .none { font-size: .92em; }
  /* ── 노트 스타일 (크라모북의 책 스타일을 가져왔다): 종이·글자·제목 색, 글꼴, 상자 색을 변수로 바꾼다 ── */
  :root { --card: color-mix(in srgb, var(--ink) 6%, var(--paper)); --rule: color-mix(in srgb, var(--ink) 16%, var(--paper)); --head: var(--ink); }
  .vp, .pg { background: var(--paper); }
  .pg.wk { background: color-mix(in srgb, var(--ink) 3.5%, var(--paper)); }
  .q { background: color-mix(in srgb, var(--qc, var(--accent)) 10%, var(--paper)); border-left-color: var(--qc, var(--accent)); color: var(--ink); }
  .q small { color: color-mix(in srgb, var(--ink) 60%, var(--paper)); } .q .att { background: color-mix(in srgb, var(--qc, var(--accent)) 20%, var(--paper)); }
  .a code, .a pre, .a th { background: var(--card); } .a th, .a td { border-color: var(--rule); }
  .a blockquote { background: var(--card); border-left-color: var(--rule); color: color-mix(in srgb, var(--ink) 80%, var(--paper)); }
  .a hr { border-top-color: var(--rule); } .a a, .wlog .f { color: var(--link, #2f5be0); }
  .whd { border-bottom-color: var(--rule); color: color-mix(in srgb, var(--ink) 70%, var(--paper)); } .whd b { color: var(--ink); }
  .wlog { color: color-mix(in srgb, var(--ink) 78%, var(--paper)); } .wlog .n { background: var(--card); color: var(--ink); } .wlog .s { color: color-mix(in srgb, var(--ink) 62%, var(--paper)); }
  .toc h4 { color: var(--head); } .tocit { color: var(--ink); border-bottom-color: var(--rule); } .tocit:hover { background: var(--card); }
  .cover button { background: var(--card); border-color: var(--rule); color: var(--ink); }
  .pg .pgin, .wlog { scrollbar-color: var(--rule) transparent; }
  /* 속지 모양(look): 표 머리와 제목의 생김새 */
  [data-look="minimal"] .a th { background: none; border: none; border-bottom: 1.5px solid var(--head); } [data-look="minimal"] .a td { border: none; border-bottom: 1px solid var(--rule); }
  [data-look="editorial"] .a th { background: none; border: none; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); } [data-look="editorial"] .a td { border: none; border-bottom: 1px solid var(--rule); }
  [data-look="editorial"] .a h4 { font-weight: 400; font-size: 1.22em; }
  [data-look="color"] .a th { background: var(--head); color: #fff; border-color: var(--head); }
  [data-look="workbook"] .a h4 { border-bottom: 2px solid var(--head); padding-bottom: .15em; } [data-look="workbook"] .a th { background: var(--card); color: var(--head); }
  [data-look="premium"] .a h4 { letter-spacing: .02em; border-left: 3px solid var(--head); padding-left: .5em; } [data-look="premium"] .a th { background: var(--card); border-color: var(--rule); }
  /* 스타일 고르는 목록 (오른쪽 도구 줄) */
  .themes { display: none; flex-direction: column; gap: 5px; padding: 2px 0 4px; }
  .themes.on { display: flex; }
  .thm { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; border: 2px solid transparent; }
  .thm i { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; } .thm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thm.on { border-color: var(--accent); } .thm:hover { filter: brightness(1.06); }
  @media (max-width: 820px) { .themes.on { flex-direction: row; } .thm { width: auto; flex: 0 0 auto; padding: 5px 8px; font-size: 12px; } }

  /* 책장: 한 줄에 두 권 */
  @media (min-width: 821px) { .shelf { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 120px; gap: 11px; scrollbar-width: thin; scrollbar-color: #4a4d57 transparent; }
    .shelf .spine { aspect-ratio: auto; height: 100%; font-size: 12.5px; padding: 9px 7px 9px 11px; } }
  .wlog .none { padding: 8px 2px 4px; text-align: left; }
  /* 날짜 표 옆: 몇 장 가운데 몇 장째 */
  .markno { flex: 0 0 auto; align-self: center; margin-left: 8px; font: 12px var(--ui); color: var(--muted); white-space: nowrap; } .markno b { color: var(--bar-text); }
  /* 요청 칸은 공책 오른쪽 쪽 맨 아래에 놓인다 */
  /* (the flip library sets display on pages itself, so the page cannot be a flex box: the box is pinned to the bottom and the text area made shorter) */
  .pg.hasask .pgin { height: calc(100% - var(--askh, 56px)); }
  .pg section + section { margin-top: 1.2em; padding-top: 1.1em; border-top: 1px dashed var(--rule); }
  .pg .ask { position: absolute; left: var(--padx); right: var(--padx); bottom: calc(var(--pady) + 8px); width: auto; margin: 0; padding: 0; gap: 6px; }
  .pg .ask textarea { background: var(--card); color: var(--ink); border-color: var(--rule); font-size: 13.5px; height: 42px; max-height: 120px; padding: 9px 11px; }
  .pg .ask textarea::placeholder { color: color-mix(in srgb, var(--ink) 45%, var(--paper)); }
  .pg .ask .send { padding: 10px 14px; }
  .wlog .whd { margin: 0 0 6px; padding-bottom: 6px; font-size: 1em; } .wlog .whd ~ .whd { margin-top: 16px; }
  /* 책을 여는 동안의 진행 막대 */
  .load { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; display: none; width: min(360px, 70%); padding: 16px 18px; border-radius: 12px;
          background: rgba(20, 22, 27, .92); box-shadow: 0 8px 28px rgba(0,0,0,.5); font: 13px var(--ui); color: var(--bar-text); text-align: center; }
  .load.on { display: block; }
  .loadtrack { height: 8px; margin-top: 10px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .loadbar { height: 100%; width: 4%; border-radius: 4px; background: var(--accent); transition: width .3s ease; }
  .loadbar.ind { width: 35% !important; animation: loadind 1.1s ease-in-out infinite alternate; }
  @keyframes loadind { from { margin-left: 0; } to { margin-left: 65%; } }

  /* 양옆 넘김 단추 위의 쪽 번호 */
  .navno { min-height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font: 700 15px var(--ui); color: var(--bar-text); line-height: 1.2; }
  .navno small { font: 11px var(--ui); color: var(--muted); }
  /* 공책 가장자리: 누르거나 안쪽으로 끌면 넘어간다 (쪽 여백 위라서 글·스크롤 막대를 가리지 않는다) */
  .edge { position: absolute; top: 0; bottom: 0; width: calc(var(--padx) - 4px); z-index: 4; cursor: pointer; touch-action: none; display: none; }
  .book.flip .edge { display: block; }
  .edge.l { left: 0; border-radius: 6px 0 0 6px; } .edge.r { right: 0; border-radius: 0 6px 6px 0; }
  .edge.off { display: none !important; }
  .edge.l:hover, .edge.l.drag { background: linear-gradient(to right, color-mix(in srgb, var(--ink) 16%, transparent), transparent); }
  .edge.r:hover, .edge.r.drag { background: linear-gradient(to left, color-mix(in srgb, var(--ink) 16%, transparent), transparent); }
  .edge::after { content: '‹'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font: 22px var(--ui); color: var(--ink); opacity: 0; transition: opacity .12s; }
  .edge.r::after { content: '›'; } .edge:hover::after, .edge.drag::after { opacity: .55; }

  /* 폰: 쪽을 두 번 터치하면 그 쪽만 화면 가득 (책장·도구 줄·요청 칸을 가린다). 다시 두 번 터치하면 원래대로 */
  .vp { touch-action: manipulation; }
  html, body { overscroll-behavior: none; }   /* 옆으로 쓸 때 브라우저의 뒤로 가기가 먹지 않게 */
  @media (max-width: 820px) {
    body.full .book { position: fixed; inset: 0; z-index: 60; width: auto; max-width: none; filter: none; }
    body.full .vp { border-radius: 0; padding-top: calc(var(--pady) + env(safe-area-inset-top)); padding-bottom: calc(var(--pady) + 14px + env(safe-area-inset-bottom)); }
    body.full .marks, body.full .pager, body.full .prog { display: none; }
    body.full .pno.r { bottom: calc(8px + env(safe-area-inset-bottom)); }
  }
  .fullhint { position: fixed; left: 50%; bottom: calc(46px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 70; padding: 7px 14px; border-radius: 16px;
              background: rgba(20,22,28,.86); color: #fff; font: 12.5px var(--ui); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; }
  .fullhint.on { opacity: 1; }

  /* two-state switches in the tool column: both states side by side, the active one is coloured */
  .sw { display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-radius: 7px; border: 1px solid #3a3d46; background: #2a2d34; color: var(--bar-text); font: 13px var(--ui); white-space: nowrap; }
  .sw > span { flex: 1 1 auto; }
  .sw button { flex: 0 0 auto; min-width: 38px; padding: 6px 9px; border-radius: 5px; border: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
  .sw button.on { background: var(--accent); color: #fff; font-weight: 700; }
  @media (max-width: 820px) { .sw { flex: 0 0 auto; font-size: 12px; padding: 2px 3px 2px 9px; } .sw > span { flex: 0 0 auto; margin-right: 4px; } .sw button { padding: 4px 8px; min-width: 32px; } }
  /* phone: the page turns like a sheet of paper (a copy of the page swings on its left edge) */
  .leaf { transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 0 18px rgba(0,0,0,.3); will-change: transform; }
  .leafsnap { pointer-events: none; }
  .rifl { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

  /* phone: typing a request must not zoom the page (the viewport is locked to 1x; the box itself uses 15px) */
  @media (max-width: 820px) { .ask textarea, .pager input { font-size: 15px; } html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } }

  /* phone: turn-sound switch in the empty bottom-left corner of the page (the tool row keeps the page-flip switch only) */
  .psnd { display: none; }
  #sndTg.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  @media (max-width: 820px) {
    .psnd { display: block; position: absolute; left: 8px; bottom: 3px; z-index: 4; width: 40px; height: 26px; border: 0; border-radius: 13px; padding: 0; font-size: 14px; line-height: 1; cursor: pointer;
            background: color-mix(in srgb, var(--ink) 10%, transparent); }
    .psnd.on { background: var(--accent); }
    body.full .psnd { bottom: calc(3px + env(safe-area-inset-bottom)); z-index: 61; position: fixed; }
    #sndTg { display: none; }
  }

  /* phone: touch the text with two fingers → a "listen" button appears below; it reads aloud from there. The bar (pause / stop) stays while it reads. */
  .rdgo { position: fixed; z-index: 73; display: none; height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: var(--accent); color: #fff; font: 700 15px var(--ui); white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.4); cursor: pointer; }
  .rdgo.on { display: block; }
  .rdnow { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 4px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  /* the bar sits in the blank strip at the bottom of the page, between the sound button and the page number (it covers neither text nor the request box) */
  .rdbar { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); z-index: 5; display: none; gap: 4px; padding: 2px; border-radius: 16px; background: rgba(20,22,28,.92); }
  .rdbar.on { display: flex; }
  .rdbar button { height: 28px; min-width: 84px; padding: 0 10px; border: 0; border-radius: 14px; font: 700 12.5px var(--ui); color: #fff; background: #3a3d46; cursor: pointer; white-space: nowrap; }
  body.full .rdbar { bottom: calc(2px + env(safe-area-inset-bottom)); }
  .rdbar #rdVoice { min-width: 40px; padding: 0 8px; }
  /* voice and speed list, opened from the bar */
  .rdmenu { position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%); z-index: 6; display: none; width: min(300px, calc(100% - 24px)); max-height: 60%; overflow-y: auto; padding: 8px; border-radius: 12px;
            background: rgba(20,22,28,.97); color: #fff; font: 13px var(--ui); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .rdmenu.on { display: block; } body.full .rdmenu { bottom: calc(38px + env(safe-area-inset-bottom)); }
  .rdmenu h5 { margin: 4px 4px 6px; font: 600 11.5px var(--ui); color: #9aa0ad; }
  .rdmenu .row { display: flex; gap: 4px; margin-bottom: 8px; } .rdmenu .row button { flex: 1; }
  .rdmenu button { display: block; width: 100%; text-align: left; min-height: 38px; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; color: #fff; font: inherit; cursor: pointer; }
  .rdmenu .row button { text-align: center; background: #2a2d34; }
  .rdmenu button.on { background: var(--accent); font-weight: 700; }
  .rdmenu p { margin: 6px 4px 2px; font-size: 11.5px; line-height: 1.5; color: #9aa0ad; }
  .rdbar #rdPause { background: var(--accent); }
  .rdtip { position: fixed; left: 50%; bottom: calc(46px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 71; padding: 7px 14px; border-radius: 16px; background: rgba(20,22,28,.9); color: #fff; font: 12.5px var(--ui);
           white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; }
  .rdtip.on { opacity: 1; }

  /* live terminal: text size steps (가－ / 가＋). Larger than the box → it scrolls sideways */
  .wh .tz { display: flex; align-items: center; gap: 2px; margin-left: auto; } .wh .tz + button { margin-left: 6px; }
  .wh .tz button { margin: 0; min-width: 30px; height: 24px; text-align: center; border-radius: 6px; background: rgba(0,0,0,.06); color: var(--ink); font-size: 12px; }
  .wh .tz button:disabled { opacity: .3; cursor: default; }
  .wh .tz i { font-style: normal; min-width: 34px; text-align: center; font-size: 11px; color: #5c5648; }
  .termbox.zoom { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }

  /* dark mode: the boxes that had fixed light colours */
  :root.dark .wh { background: #1f222a; color: #a9adba; } :root.dark .wh b { color: var(--ink); } :root.dark .wh button { color: #8ab4ff; }
  :root.dark .wh .tz button { background: rgba(255,255,255,.1); color: var(--ink); } :root.dark .wh .tz i { color: #a9adba; }
  :root.dark .steps { background: #14161b; color: #b9bcc8; border-top-color: #2a2d36; } :root.dark .steps .f { color: #8ab4ff; } :root.dark .steps .n { color: #a9adba; }
  :root.dark .work { border-color: #2a2d36; }
  :root.dark .pg.wk { background: #0b0c0f; }
  :root.dark .q { background: #17191f; } :root.dark .att { background: #23262f; color: var(--ink); }
  :root.dark .pg, :root.dark .vp { box-shadow: inset 0 0 0 1px #2a2d36; }
  :root.dark .gutter { opacity: .5; }

  /* 🔍 search: slides down from the top. Left = list of matching requests, right = the picked one. */
  .find { position: fixed; z-index: 80; left: 50%; top: 0; width: min(1040px, 94vw); display: flex; flex-direction: column; background: #1f2126; color: #e8e9ee; border: 1px solid #3a3d46; border-top: 0;
          border-radius: 0 0 14px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.55); font: 13.5px var(--ui); transform: translate(-50%, calc(-105% + var(--fy, 0px)));
          transition: transform .45s cubic-bezier(.22,.8,.3,1), visibility 0s linear .45s; visibility: hidden; }
  .find.on { transform: translate(-50%, var(--fy, 0px)); visibility: visible; transition: transform .45s cubic-bezier(.22,.8,.3,1), visibility 0s; }
  /* 손가락으로 끄는 동안엔 손가락을 그대로 따라온다(애니메이션 없음) — 떼면 위의 .45s 로 천천히 자리 잡는다 */
  .find.drag { transition: none; visibility: visible; }
  /* 검색칸 아래 빈 곳을 누르면 닫힌다 — 그동안 뒤 화면은 살짝 어둡게 */
  .findbg { position: fixed; inset: 0; z-index: 79; background: rgba(0,0,0,.28); opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s linear .3s; }
  body.finding .findbg { opacity: 1; visibility: visible; transition: opacity .3s, visibility 0s; }
  .findbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #33363e; }
  .findbar input { flex: 1 1 auto; min-width: 0; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid #3a3d46; background: #14161b; color: #fff; font: 15px var(--ui); outline: none; }
  .findbar input:focus { border-color: var(--accent); }
  .findn { flex: 0 0 auto; color: #9aa0ad; font-size: 12px; white-space: nowrap; }
  .findx { flex: 0 0 auto; width: 42px; height: 42px; border: 0; border-radius: 10px; background: #2a2d34; color: #fff; font-size: 16px; cursor: pointer; }
  /* 결과 칸은 찾을 말을 입력해야 펼쳐지고(.has), 닫을 땐 먼저 접힌 뒤 검색칸이 올라간다 */
  .findbody { flex: 0 0 auto; height: 0; overflow: hidden; display: flex; transition: height .35s cubic-bezier(.22,.8,.3,1); }
  .find.has .findbody { height: calc(min(82vh, 760px) - 63px); }
  .find:not(.has) .findbar { border-bottom-color: transparent; }
  .findlist { flex: 0 0 34%; min-width: 0; overflow-y: auto; border-right: 1px solid #33363e; padding: 6px; }
  .findit { display: block; width: 100%; text-align: left; padding: 8px 9px; margin-bottom: 4px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .findit:hover { background: #2a2d34; } .findit.on { background: #2a2d34; border-color: var(--accent); }
  .findit small { display: block; color: #9aa0ad; font-size: 11px; margin-bottom: 2px; }
  .findit b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .findit span { display: block; margin-top: 2px; color: #b9bcc8; font-size: 12px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
  .find mark { background: #ffd54a; color: #1a1a1a; border-radius: 2px; padding: 0 1px; }
  .findview { flex: 1 1 auto; min-width: 0; overflow-y: auto; background: var(--paper); color: var(--ink); position: relative; }
  .findmsg { padding: 30px 16px; text-align: center; color: var(--muted); font: 13.5px var(--ui); }
  .findgo { position: sticky; top: 0; z-index: 1; padding: 8px 10px; background: var(--paper); border-bottom: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
  .findgo button { width: 100%; height: 40px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font: 700 14px var(--ui); cursor: pointer; }
  .findpaper { padding: 12px 14px 24px; font-family: var(--body); font-size: calc(var(--fs) * var(--fsk, 1)); line-height: var(--lh, 1.75); }
  .findpaper pre { max-height: none; }
  .turn.found { animation: foundflash 1.6s ease-out; border-radius: 6px; }
  @keyframes foundflash { 0%, 40% { background: color-mix(in srgb, var(--accent) 26%, transparent); } 100% { background: transparent; } }
  @media (max-width: 820px) {
    .find.has .findbody { height: calc(100dvh - 63px - env(safe-area-inset-top)); }
    .find { width: 100vw; border: 0; border-radius: 0; left: 0; transform: translateY(calc(-105% + var(--fy, 0px))); padding-top: env(safe-area-inset-top); }
    .find.on { transform: translateY(var(--fy, 0px)); }
    .findn { display: none; }
    .findlist { flex-basis: 40%; padding: 4px; } .findit { padding: 7px 6px; } .findit b { font-size: 12.5px; } .findit span { font-size: 11.5px; -webkit-line-clamp: 3; }
    .findpaper { padding: 10px 10px 24px; }
    #findBtn { order: -1; }

  req:'Request', working:'Working', work:'Work', tools:'{n} tool calls', files:'{n} files edited', noedit:'read only', open:'Show the work', close:'Hide', big:'Larger', small:'Smaller',
  pending:'The answer lands here when the work is done.', sending:'Sent. A new page appears once the session picks it up.', more:'Load {n} earlier requests', turns:'{n} requests',

   ending (crownyclass.com/go/x). An address stops at Korean text, so "https://a.com/x에서" links only the address.
   Not after = ' " > / @ . - or a letter, so href="…", link text and e-mail addresses are left alone. */
const URL_RX = /(^|[^"'=\w>\/@.\-])((?:https?:\/\/|www\.)[^\s<>)*ㄱ-ㆎ가-힣]+|(?:[a-z0-9-]+\.)+(?:com|net|org|io|kr|dev|app|ai|me|co|xyz|site|shop|link|page)(?:\/[^\s<>)*ㄱ-ㆎ가-힣]*)?(?![\w-]|\.\w))/gi;

    const t = (u.match(/(?:[.,;:!?'\]]|&quot;|&#39;)+$/) || [''])[0]; if (t) u = u.slice(0, -t.length);
    if (!u) return m;

// ── small markdown renderer (headings, lists, tables, code, quotes, links) — enough for assistant answers
function inline(s) {
  const keep = [];

function md(src) {
  const L = String(src || '').replace(/\r/g, '').split('\n'); let out = '', i = 0, para = [];

const tocList = list => list.map(t => '<button type="button" class="tocit full" data-i="' + t.i + '"><small>' + fmtT(t.ts).slice(6) + '</small><span>' + attOnly(t.req.trim()) + '</span></button>').join('');

    list.innerHTML = hits.map((h, i) => { const inReq = h.t.req.toLowerCase().includes(ql), one = h.t.req.replace(/\s+/g, ' ').trim();
      return '<button type="button" class="findit" data-k="' + i + '"><small>' + esc(fmtT(h.t.ts)) + '</small><b>' + (inReq ? hl(one.slice(0, 60), q) : esc(one.slice(0, 60))) + '</b><span>' + hl(snip(inReq && !h.t.ans.toLowerCase().includes(ql) ? h.t.req : h.t.ans, q) || snip(h.t.req, q), q) + '</span></button>'; }).join('');
    if (!hits.length) { view.innerHTML = '<div class="findmsg">' + esc(F.none) + '</div>'; sel = -1; return; }
    show(0);
  }
  // go to the page where that request starts (loading older pages first when needed)
  async function jump(i) {
    close(); const id = cur.id;
    for (let n = 0; n < 40 && cur && cur.id === id && start > i && start > 0; n++) await loadEarlier();
    if (!cur || cur.id !== id) return;
    // 검색으로 옮길 때도 쪽을 넘긴다 — 순간 이동이면 책장을 넘긴 느낌이 없다(2026-10-24 사장님). go() 가 넘김 효과·소리 설정을 따른다
    if (pf) { const k = pfPages.findIndex(p => p.dataset.i === String(i)); if (k >= 0) go(Math.floor(k / 2)); return; }
    const el = flow.querySelector('.turn[data-i="' + i + '"]'); if (!el) return;
    go(Math.floor(colOf(el) / perView()));
    el.classList.add('found'); setTimeout(() => el.classList.remove('found'), 1600);
  }
  let rt;
  const setHas = () => box.classList.toggle('has', !!fin.value.trim());
  fin.addEventListener('input', () => { setHas(); clearTimeout(rt); rt = setTimeout(run, 220); });
  fin.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') close(); else if (e.key === 'Enter') { e.preventDefault(); if (hits[sel]) jump(hits[sel].t.i); }
    else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && hits.length) { e.preventDefault(); show(Math.max(0, Math.min(hits.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1)))); const b = list.children[sel]; if (b) b.scrollIntoView({ block: 'nearest' }); } });
  list.addEventListener('click', e => { const b = e.target.closest('.findit'); if (b) show(+b.dataset.k); });
  // open: only the bar comes down; the results unfold once there is something typed (an earlier word unfolds after the bar lands)
  // close: the results fold up first, then the bar slides away (2026-10-17 사장님)
  let ct = 0, ht = 0, openedAt = 0;
  function open() { if (!cur || (box.classList.contains('on') && !ct)) return; clearTimeout(ct); ct = 0; openedAt = Date.now(); if (window.readAloud) readAloud.stop(); box.classList.add('on'); document.body.classList.add('finding');
    if (!fin.value) run(); else { clearTimeout(ht); ht = setTimeout(setHas, 450); } fin.focus(); fin.select(); }
  function close() { clearTimeout(ht); document.body.classList.remove('finding'); fin.blur(); if (!box.classList.contains('on') || ct) return;
    if (box.classList.contains('has')) { box.classList.remove('has'); ct = setTimeout(() => { ct = 0; box.classList.remove('on'); }, 320); } else box.classList.remove('on'); }
  window.bookFind = { open, close, run, get hits() { return hits.length; } };
  box.querySelector('#findX').onclick = close; sb.onclick = open;
  bg.onclick = () => { if (Date.now() - openedAt > 450) close(); };   // 쓸어내린 손을 떼며 생기는 클릭으로 바로 닫히지 않게
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); open(); } else if (e.key === 'Escape' && box.classList.contains('on')) close(); }, true);
  // phone: swipe down on the page → the panel follows the finger and settles slowly; swipe up on the bar → it follows up and slides away slowly
  // (2026-10-17 사장님: 쓸어내리면 서서히 나타나고, 올리면 천천히 위로 사라지게)
  const setFy = px => { if (px) box.style.setProperty('--fy', px + 'px'); else box.style.removeProperty('--fy'); };
  let sy = 0, sx = 0, st = 0, sok = false, sdrag = false;
  // 글을 고르는 중이면 쓸어내리기가 아니다 — 고른 글 끝을 아래로 끌다가 검색창이 열렸다(2026-10-31 사장님). 길게 눌러 고르기 시작한 손가락도 마찬가지(움직이기 전에 0.35초 넘게 눌렀으면)
  const selecting = () => { try { const g = getSelection(); return !!(g && !g.isCollapsed && String(g).trim()); } catch (e) { return false; } };
  vp.addEventListener('touchstart', e => { sok = e.touches.length === 1 && !pf && !box.classList.contains('on') && !selecting() && !e.target.closest('pre, .steps, .termbox, textarea, input, table'); sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); sdrag = false; }, { passive: true });
  vp.addEventListener('touchmove', e => { if (!sok || e.touches.length !== 1) return; const dy = e.touches[0].clientY - sy, dx = e.touches[0].clientX - sx;
    if (selecting()) { if (sdrag) { sdrag = false; box.classList.remove('drag'); setFy(0); } sok = false; return; }
    if (!sdrag && Date.now() - st > 350) { sok = false; return; }
    if (!sdrag) { if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy)) { sok = false; return; } if (dy > 14 && dy > Math.abs(dx) * 1.5) { sdrag = true; box.classList.add('drag'); } else return; }
    setFy(Math.max(0, Math.min(dy - 14, box.offsetHeight))); }, { passive: true });
  vp.addEventListener('touchend', e => { if (!sok || e.touches.length) return; const c = e.changedTouches[0], dy = c.clientY - sy, dx = c.clientX - sx; sok = false;
    if (!sdrag) return;
    sdrag = false; box.classList.remove('drag'); setFy(0);
    if (dy > 90 || (dy > 40 && Date.now() - st < 300)) open();       // 충분히 끌었거나 빠르게 튕기면 열고, 아니면 천천히 도로 올라간다
  }, { passive: true });
  vp.addEventListener('touchcancel', () => { if (sdrag) { sdrag = false; box.classList.remove('drag'); setFy(0); } sok = false; }, { passive: true });
  const bar = box.querySelector('.findbar'); let by = 0, bt = 0, bdrag = false;
  bar.addEventListener('touchstart', e => { by = e.touches[0].clientY; bt = Date.now(); bdrag = false; }, { passive: true });
  bar.addEventListener('touchmove', e => { const dy = e.touches[0].clientY - by; if (!bdrag && dy < -10) { bdrag = true; clearTimeout(ht); box.classList.remove('has'); box.classList.add('drag'); } if (bdrag) setFy(Math.min(0, dy + 10)); }, { passive: true });
  bar.addEventListener('touchend', e => { const dy = e.changedTouches[0].clientY - by; if (!bdrag) return; bdrag = false; box.classList.remove('drag'); setFy(0);
    if (dy < -50 || (dy < -25 && Date.now() - bt < 300)) close(); else setHas(); }, { passive: true });
}
(async () => {
  await loadSessions();
  const want = QS.get('s') || (() => { try { return localStorage.getItem('pt_book_last'); } catch (e) { return null; } })();
  const s = sessions.find(x => x.id === want) || sessions.find(x => (x.agent || 'claude') === 'claude') || sessions[0];
  if (s) openBook(s.id); else render(true);
})();
</script>
